apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebayshopping.fullname" . }}
  labels:
    {{- include "ebayshopping.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "ebayshopping.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Zero-downtime deploys: never remove a pod before its replacement is ready.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "ebayshopping.selectorLabels" . | nindent 8 }}
      annotations:
        # Config change -> checksum change -> automatic rolling restart.
        # Without this, editing the ConfigMap would leave stale pods running.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Conventional scrape hints: metrics live on the internal actuator port.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ebayshopping.serviceAccountName" . }}
      # The app never calls the Kubernetes API - don't mount a token it
      # doesn't need (one less credential to steal from a compromised pod).
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        # Prefer one replica per node; ScheduleAnyway so a single-node
        # moment (autoscaler scaled down) never blocks a rollout.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ebayshopping.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ include "ebayshopping.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ebayshopping.fullname" . }}
          env:
            # Surface the exact build in the UI footer and /api/info.
            - name: APP_VERSION
              value: {{ include "ebayshopping.imageTag" . | quote }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          lifecycle:
            preStop:
              # Native sleep action - distroless has no shell, so the classic
              # `sh -c "sleep 15"` is not an option.
              sleep:
                seconds: {{ .Values.lifecycle.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Writable /tmp because the root filesystem is read-only
            # (Tomcat needs a work directory).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
