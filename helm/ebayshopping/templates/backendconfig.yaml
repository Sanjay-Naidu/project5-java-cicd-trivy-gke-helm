# GKE-specific CRD that tunes the Google LB backend service.
# WHY it exists: without it, the LB health check defaults to "GET /" and
# expects 200. That happens to work here, but it would mark pods healthy
# while they are still warming up, and it silently breaks the day "/"
# redirects or needs auth. Pointing it at /readyz means the LB and
# Kubernetes agree on exactly when a pod may receive traffic.
{{- if .Values.ingress.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "ebayshopping.fullname" . }}
  labels:
    {{- include "ebayshopping.labels" . | nindent 4 }}
spec:
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.backendConfig.healthCheckPath }}
    port: 8080
    checkIntervalSec: {{ .Values.backendConfig.checkIntervalSec }}
    timeoutSec: {{ .Values.backendConfig.timeoutSec }}
    healthyThreshold: {{ .Values.backendConfig.healthyThreshold }}
    unhealthyThreshold: {{ .Values.backendConfig.unhealthyThreshold }}
  connectionDraining:
    drainingTimeoutSec: {{ .Values.backendConfig.drainingTimeoutSec }}
{{- end }}
