# =============================================================================
# Project : Project 5 - Java (Spring Boot) App CI/CD on Google GKE
# Author  : Sanjay Naidu
# File    : helm/ebayshopping/values-dev.yaml - dev namespace overrides
# =============================================================================
# Dev priorities: cheap and fast. One replica, smaller CPU request, and NO
# ingress - each GKE Ingress creates its own Google load balancer (~$18/month),
# so dev is reached with `kubectl port-forward` instead.

replicaCount: 1

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 768Mi

appConfig:
  APP_ENVIRONMENT: "dev"
  LOG_LEVEL: "DEBUG"
