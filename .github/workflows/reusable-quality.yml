# =============================================================================
# Project : Project 5 - Java (Spring Boot) App CI/CD on Google GKE
# Author  : Sanjay Naidu
# File    : .github/workflows/reusable-quality.yml
# =============================================================================
# WHY a reusable workflow: PR validation AND the main deploy pipeline both
# need identical build/test/lint steps. Defining them once (DRY) means the
# checks can never drift apart between the two pipelines.
#
# SonarCloud is OPTIONAL: it runs only when the repository variable
# SONAR_ENABLED is 'true'. Without it, the JaCoCo coverage gate inside
# `mvn verify` (70% lines) still fails the build on untested code.
#
# Every third-party action is pinned to a full commit SHA (tag in the
# comment). Tags can be moved by whoever controls the action's repo - a SHA
# cannot. Dependabot keeps the SHAs current.

name: Reusable - Code Quality

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build-test:
    name: Maven build, tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to attribute code age / new-code period.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml

      # verify = compile + unit tests + integration tests (real HTTP on
      # random ports) + JaCoCo report + JaCoCo 70% coverage gate.
      - name: mvn verify
        working-directory: app
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        working-directory: app
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9} END {
              printf "### Test coverage\n\nLine coverage: **%.1f%%** (%d of %d lines)\n", covered*100/(missed+covered), covered, missed+covered
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test + coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            app/target/surefire-reports/
            app/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: SonarCloud analysis
        if: vars.SONAR_ENABLED == 'true'
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # qualitygate.wait=true: the step FAILS if the Sonar quality gate fails.
        run: |
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.qualitygate.wait=true

  helm-lint:
    name: Helm lint + schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kubeconform" -v

      # Render both environments and validate every manifest against the
      # Kubernetes API schemas. BackendConfig is a GKE CRD with no public
      # schema, so missing schemas are skipped rather than failed.
      - name: Lint and validate (dev + prod)
        run: |
          for env in dev prod; do
            echo "::group::$env"
            helm lint --strict ./helm/ebayshopping -f ./helm/ebayshopping/values-$env.yaml --set image.tag=sha-ci
            helm template ebayshopping ./helm/ebayshopping -f ./helm/ebayshopping/values-$env.yaml --set image.tag=sha-ci \
              | kubeconform -strict -summary -ignore-missing-schemas
            echo "::endgroup::"
          done

      # The chart must REFUSE mutable tags - prove the guard still works.
      - name: Chart rejects 'latest' and empty tags
        run: |
          if helm template x ./helm/ebayshopping --set image.tag=latest >/dev/null 2>&1; then
            echo "::error::chart rendered with image.tag=latest"; exit 1
          fi
          if helm template x ./helm/ebayshopping >/dev/null 2>&1; then
            echo "::error::chart rendered without an image tag"; exit 1
          fi
          echo "immutable-tag guard OK"
