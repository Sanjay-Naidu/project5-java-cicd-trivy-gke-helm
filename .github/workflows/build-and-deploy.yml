# =============================================================================
# Project : Project 5 - Java (Spring Boot) App CI/CD on Google GKE
# Author  : Sanjay Naidu
# File    : .github/workflows/build-and-deploy.yml - main CI/CD pipeline
# =============================================================================
# Flow on every merge to main:
#   quality -> build + Trivy scan + SBOM -> push to Artifact Registry
#           -> deploy DEV (auto) + helm test
#           -> deploy PROD (manual approval via the 'prod' GitHub environment)
#              + helm test + external check through the public load balancer
#
# Auth design: google-github-actions/auth uses Workload Identity Federation.
# GitHub gives each run a short-lived signed OIDC token; Google verifies it
# came from THIS repository and exchanges it for a 1-hour access token of
# the deployer service account. No service account key exists anywhere.
# Inside the cluster, nodes pull from Artifact Registry with their own
# service account, so there are no imagePullSecrets either.
#
# Decommission-safe: if the GCP_PROJECT_ID variable is empty (platform torn
# down), the image is still built and scanned but push/deploy are skipped -
# the pipeline stays green instead of failing against deleted resources.

name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
  workflow_dispatch: {} # manual re-run button

# One pipeline at a time; never cancel a running deployment mid-flight.
concurrency:
  group: build-deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the GitHub OIDC token

env:
  IMAGE_NAME: ebayshopping
  HELM_VERSION: v4.3.0

jobs:
  quality:
    name: Code quality
    uses: ./.github/workflows/reusable-quality.yml
    secrets: inherit

  build-scan-push:
    name: Build, scan, push to Artifact Registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_repo: ${{ steps.meta.outputs.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Immutable tag from the commit SHA: every image maps 1:1 to a commit,
      # which makes "what is running in prod?" answerable and rollbacks exact.
      - name: Compute image tag
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} .

      # Gate BEFORE push: a vulnerable image never reaches the registry.
      - name: Trivy image scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      # SBOM = the image's ingredient list. When the next Log4Shell-style CVE
      # lands, "are we affected?" is a search, not an investigation.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Authenticate to Google Cloud (OIDC - no keys)
        if: vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The repo has immutable tags, so re-running the pipeline for the same
      # commit must not try to overwrite sha-xxxxxxx - it reuses the image
      # that was already scanned and pushed.
      - name: Push to Artifact Registry
        if: vars.GCP_PROJECT_ID != ''
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          if gcloud artifacts docker images describe "$REPO:$TAG" >/dev/null 2>&1; then
            echo "$REPO:$TAG already exists (immutable) - reusing it"
          else
            docker tag "${{ env.IMAGE_NAME }}:$TAG" "$REPO:$TAG"
            docker push "$REPO:$TAG"
          fi
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REPO:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-scan-push
    if: vars.GCP_PROJECT_ID != ''
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          # The cluster's IP endpoint only accepts control-plane authorized
          # networks, and GitHub's runners have no fixed egress IP to allow.
          # The DNS-based endpoint is reachable from anywhere and is gated by
          # IAM instead of by IP - better than opening the IP to 0.0.0.0/0.
          use_dns_based_endpoint: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # --rollback-on-failure (Helm 4's name for --atomic): if the release
      # does not become healthy in time, Helm rolls back to the previous
      # revision - a failed deploy never leaves dev (or prod) half-broken.
      - name: Helm deploy (dev namespace)
        run: |
          helm upgrade --install ebayshopping ./helm/ebayshopping \
            --namespace dev --create-namespace \
            -f ./helm/ebayshopping/values-dev.yaml \
            --set image.repository=${{ needs.build-scan-push.outputs.image_repo }} \
            --set image.tag=${{ needs.build-scan-push.outputs.image_tag }} \
            --rollback-on-failure --wait --timeout 8m

      - name: Smoke test (helm test)
        run: helm test ebayshopping -n dev --logs

  deploy-prod:
    name: Deploy to PROD (requires approval)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-scan-push, deploy-dev]
    if: vars.GCP_PROJECT_ID != ''
    # The 'prod' GitHub environment has a required reviewer - the pipeline
    # PAUSES here until approved. This is the promotion gate: the EXACT
    # image verified in dev goes to prod, nothing is rebuilt.
    environment:
      name: prod
      url: ${{ steps.endpoint.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          # The cluster's IP endpoint only accepts control-plane authorized
          # networks, and GitHub's runners have no fixed egress IP to allow.
          # The DNS-based endpoint is reachable from anywhere and is gated by
          # IAM instead of by IP - better than opening the IP to 0.0.0.0/0.
          use_dns_based_endpoint: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # 15m timeout: with container-native LB, GKE adds a readiness gate so a
      # pod only counts as Ready once the Google LB health check passes. On
      # the very first deploy that includes building the LB itself.
      - name: Helm deploy (prod namespace)
        run: |
          helm upgrade --install ebayshopping ./helm/ebayshopping \
            --namespace prod --create-namespace \
            -f ./helm/ebayshopping/values-prod.yaml \
            --set image.repository=${{ needs.build-scan-push.outputs.image_repo }} \
            --set image.tag=${{ needs.build-scan-push.outputs.image_tag }} \
            --rollback-on-failure --wait --timeout 15m

      - name: Smoke test (helm test)
        run: helm test ebayshopping -n prod --logs

      # "Healthy inside the cluster" and "reachable from the internet" are
      # different claims. helm test proves the first; this step proves the
      # second, through the real Google load balancer - and checks that the
      # public URL serves the version we just deployed.
      # First-ever deploy: Google needs ~5-10 min to program the LB, hence
      # the long retry window. Later deploys pass on the first attempt.
      - name: Verify through the public load balancer
        id: endpoint
        env:
          EXPECTED: ${{ needs.build-scan-push.outputs.image_tag }}
        run: |
          for i in $(seq 1 30); do
            IP=$(kubectl -n prod get ingress ebayshopping -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$IP" ] && break
            echo "waiting for ingress IP ($i/30)..."; sleep 10
          done
          [ -n "$IP" ] || { echo "::error::ingress never got an IP"; kubectl -n prod describe ingress ebayshopping; exit 1; }
          echo "url=http://$IP/" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 60); do
            VERSION=$(curl -fsS --max-time 5 "http://$IP/api/info" 2>/dev/null | jq -r '.version' 2>/dev/null || true)
            if [ "$VERSION" = "$EXPECTED" ]; then
              echo "Public endpoint http://$IP/ is serving $VERSION"
              {
                echo "### ebayshopping is live"
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| URL | http://$IP/ |"
                echo "| Version | \`$VERSION\` |"
              } >> "$GITHUB_STEP_SUMMARY"
              kubectl -n prod get pods,svc,ingress,hpa
              exit 0
            fi
            echo "attempt $i/60: public endpoint not serving $EXPECTED yet (got: ${VERSION:-no response})"
            sleep 15
          done
          echo "::error::public endpoint never served $EXPECTED"
          kubectl -n prod describe ingress ebayshopping
          exit 1
